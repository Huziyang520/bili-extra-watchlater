<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>额外稍后再看</title>
  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="icons/icon48.png" alt="" />
        <div>
          <h1>额外稍后再看</h1>
          <p class="sub">本地收藏，与原版「稍后再看」互不影响</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="btnExport" class="btn ghost" type="button">导出 JSON</button>
        <button id="btnImport" class="btn ghost" type="button">导入备份</button>
        <input id="fileImport" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <section class="card storage">
      <div class="storage-head">
        <h2>数据保存在本机</h2>
        <button id="btnCopyPath" class="btn tiny" type="button">复制路径</button>
      </div>
      <div class="kv">
        <div><span>扩展 ID</span><code id="extId">读取中…</code></div>
        <div><span>Chrome 数据目录</span><code id="pathChrome">读取中…</code></div>
        <div><span>Edge 数据目录</span><code id="pathEdge">读取中…</code></div>
        <div><span>当前占用</span><code id="usage">读取中…</code></div>
        <div><span>导出文件位置</span><code id="exportPath">浏览器默认下载目录</code></div>
      </div>
      <p class="hint">目录里的 <code>&lt;配置文件&gt;</code> 对应 <code>chrome://version</code> 中「个人资料路径」的最后一段（通常是 Default）。卸载扩展、移动文件夹或换用另一个浏览器配置后扩展 ID 会变化，旧数据仍在磁盘上但新扩展读不到，建议定期导出 JSON 备份。</p>
    </section>

    <div class="main">
      <aside class="card side">
        <h2>列表 <span id="statLists" class="badge">0</span></h2>
        <ul id="listUl" class="lists"></ul>
        <form id="newListForm" class="newlist">
          <input id="newListName" maxlength="40" placeholder="新列表名称" autocomplete="off" />
          <button class="btn primary" type="submit">新建</button>
        </form>
        <p class="hint" id="totalHint">共 0 条</p>
      </aside>

      <section class="card content">
        <div class="toolbar">
          <input id="search" class="search" placeholder="搜索标题或 BV 号" autocomplete="off" />
          <select id="scope">
            <option value="list">当前列表</option>
            <option value="all">全部列表</option>
          </select>
          <span id="range" class="range"></span>
        </div>
        <ul id="items" class="items"></ul>
        <div id="empty" class="empty">还没有条目。到 B 站任意视频卡片上点「稍后」即可加入。</div>
      </section>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="lib/store.js"></script>
  <script src="manager.js"></script>
</body>
</html>
